# Building #9. Specs below are estimates; replace them with real values when known.
number: 9
name: Greek Revival Test House
location: Location TBD # TODO: set the city
type: Single-family residence
style: Greek Revival
# Estimated from the floor plans (marked "not to scale"; stair treads set the scale).
bedrooms: 3
bathrooms: 1.5 # .5 = half bath
stories: 2 # sets the building's size on the homepage
squareFeet: 1800
lotWidth: 40 # feet
lotDepth: 100 # feet
description: >
  A plum clapboard Greek Revival with a full-height pedimented front, stacked
  galleries on tall columns, Chinese Chippendale railings on the upper porch and turned
  balusters below, black shutters, and an iron fence around a small front garden. A
  side-hall foyer holds the stair and leads past the front parlor to the dining room,
  with the kitchen and a powder room across the back. Upstairs, three bedrooms and a
  bath open off a central hall, and the front bedrooms share the upper porch.

# Transparent-background version of the isometric image, used on the homepage.
cutout: ./cutout.png

photos:
  - src: ./Greek Revival Test House Isometric.png
    alt: Isometric illustration of a plum Greek Revival house with a pedimented two-story porch, cream columns, black shutters, and an iron fence
    caption: Isometric view

# Line-only plans generated by `npm run floorplans` from floorplan-level-*.png (cropped to remove
# the printed titles; both levels are drawn at the same scale).
floorPlans:
  - src: ./floorplan-level-1.lines.png
    alt: Main floor plan showing a side-hall foyer and stair, front parlor, dining room, kitchen, powder room, and a columned front porch
    caption: Level 1
  - src: ./floorplan-level-2.lines.png
    alt: Upper floor plan showing three bedrooms, a bath, a landing and hall, and a columned upper porch
    caption: Level 2

model:
  src: /models/greek-revival-house.glb
  alt: 3D model of the Greek Revival Test House
