# Building #4. Specs below are estimates; replace them with real values when known.
number: 4
name: Moorish Test House
location: Santa Barbara, CA
type: Single-family residence
style: Moorish
# Estimated from the floor plans (stair widths set the scale).
bedrooms: 3
bathrooms: 3.5 # .5 = half bath
squareFeet: 3300
lotWidth: 45 # feet
lotDepth: 110 # feet
description: >
  A whitewashed Moorish Revival tower house with a green-and-white checkered
  tile dome, horseshoe-arched windows, crenellated parapets, and a blue-tiled
  archway leading through a zaguán to the entry hall. The ground floor holds a
  gallery, dining room, pantry, kitchen with island, and a powder room. The
  second floor has a living room with wet bar, study, bath, and guest room; the
  third floor has two bedrooms, a primary bath, a balcony, and a roof deck. At
  the top, a mirador opens onto the roof terrace.

# Transparent-background version of the isometric image, used on the homepage.
cutout: ./cutout.png

photos:
  - src: ./Moorish Test House Isometric.jpg
    alt: Isometric illustration of a white Moorish tower house with a checkered green dome, arched windows, bougainvillea, palm trees, and a blue-tiled entry arch
    caption: Isometric view

# Line-only plans generated by `npm run floorplans` from the floorplan-*.png originals.
# (floorplan-level-*.png were cropped and resized from tower_house_*.jpg to remove the baked-in
# titles; all four levels are already drawn at the same scale.)
floorPlans:
  - src: ./floorplan-level-1.lines.png
    alt: First floor plan showing a zaguán entry, entry hall, gallery, dining room, pantry, kitchen with island, powder room, and porch
    caption: Level 1
  - src: ./floorplan-level-2.lines.png
    alt: Second floor plan showing a living room with wet bar, study, bath, hall, and guest room
    caption: Level 2
  - src: ./floorplan-level-3.lines.png
    alt: Third floor plan showing a primary bedroom with bath and balcony, a bedroom, bath, hall, and roof deck
    caption: Level 3
  - src: ./floorplan-level-4.lines.png
    alt: Roof plan showing the mirador stair tower and roof terrace, with the deck below outlined
    caption: Roof

model:
  src: /models/moorish-tower-house.glb
  alt: 3D model of the Moorish Test House
