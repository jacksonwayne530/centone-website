# Building #7. Units, stories, square footage, and dimensions are from public sources and the
# owner. Bedroom and bathroom totals are estimates (the exact unit mix isn't published).
number: 7
name: The Yard
location: Portland, OR
type: Mixed-use apartment tower
style: Contemporary
units: 284
# Estimated building totals, assuming roughly 30% studios, 50% one-bedrooms, and 20% two-bedrooms.
bedrooms: 260
bathrooms: 340 # .5 = half bath
stories: 21
height: 210 # feet; sets the building's size on the homepage
squareFeet: 343100
lotWidth: 180 # feet
lotDepth: 200 # feet
specsNote: Units, stories, and square footage are from public sources. Bedroom and bathroom totals are estimates.
description: >
  A 21-story apartment tower at the east end of the Burnside Bridge, designed by
  Skylab Architecture and completed in 2016. A dark, bronze-toned skin of glass
  and metal panels wraps a tower turned to face the Willamette River, with views
  of downtown to the west and the mountains to the east. It rises from a podium
  with shops along the sidewalk and a folded green roof at the fifth level that
  lifts the native landscape up to the height of the bridge. The podium roof is
  open to the public as well as residents, with a spa, fitness, and co-working
  space; its landscape won a 2018 honor award from the American Society of
  Landscape Architects. The tower holds 284 studios and one- and two-bedroom
  apartments, including affordable studios on the sixth through eighth floors.

# Transparent-background version of the isometric image, used on the homepage.
cutout: ./cutout.png

photos:
  - src: ./The Yard Isometric.png
    alt: Isometric illustration of a dark bronze 21-story apartment tower rising from a podium with a landscaped green roof, storefronts, and street trees
    caption: Isometric view

# Line-only plans generated by `npm run floorplans` from floorplan-unit-*.png. These are two
# typical apartments rather than whole floors.
floorPlans:
  - src: ./floorplan-unit-1.lines.png
    alt: Two-bedroom, two-bath corner apartment with an angled window wall along the living and dining room and the second bedroom
    caption: Two-bedroom corner unit
  - src: ./floorplan-unit-2.lines.png
    alt: Two-bedroom apartment with an open kitchen, dining, and living room along a window wall, plus laundry
    caption: Two-bedroom unit

model:
  src: /models/the-yard-portland.glb
  alt: 3D model of The Yard
