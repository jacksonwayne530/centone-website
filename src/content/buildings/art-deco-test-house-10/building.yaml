# Building #10. Specs below are estimates; replace them with real values when known.
number: 10
name: Art Deco Test House
location: Miami Beach, FL
type: Single-family residence
style: Art Deco
# Estimated from the floor plans (marked "not to scale"; stair treads set the scale).
bedrooms: 3
bathrooms: 1.5 # .5 = half bath
stories: 2 # sets the building's size on the homepage
squareFeet: 1900
lotWidth: 40 # feet
lotDepth: 100 # feet
description: >
  A coral stucco house in the streamlined end of Art Deco, with a flat roof behind a
  parapet, a rounded corner wrapped in steel ribbon windows on both floors, cream
  speed-line bands, and a stair tower of glass block rising beside a tall fin. A
  curved canopy shelters the front door. Downstairs, one long room runs from the
  kitchen through dining to a living room that follows the curved corner, with a
  study, powder room, and foyer along the other side. Upstairs are a primary bedroom
  in the rounded corner, two more bedrooms, and a bath, off a landing lit by the
  glass-block stair.

# Transparent-background version of the isometric image, used on the homepage. Made with
# `npm run cutout -- ... --no-pockets` so the cream trim stays solid.
cutout: ./cutout.png

photos:
  - src: ./Art Deco Test House Isometric.png
    alt: Isometric illustration of a coral Art Deco house with curved corner windows, cream speed-line bands, and a glass-block stair tower
    caption: Isometric view

# Line-only plans generated by `npm run floorplans` from floorplan-level-*.png (cropped to remove
# the printed titles; both levels are drawn at the same scale).
floorPlans:
  - src: ./floorplan-level-1.lines.png
    alt: Main floor plan showing a kitchen, dining room, and living room with a curved corner, a study, powder room, foyer, and stair
    caption: Level 1
  - src: ./floorplan-level-2.lines.png
    alt: Upper floor plan showing a primary bedroom with a curved corner, two more bedrooms, a bath, and a landing
    caption: Level 2

model:
  src: /models/art-deco-house.glb
  alt: 3D model of the Art Deco Test House
