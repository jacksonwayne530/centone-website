# Building #1. Specs below are estimates; replace them with real values when known.
number: 1
name: Victorian Test House
location: Portland, OR
type: Single-family residence
style: Victorian
# Estimated from the floor plans (stair widths set the scale).
bedrooms: 3
bathrooms: 2 # .5 = half bath
squareFeet: 1900
lotWidth: 40 # feet
lotDepth: 100 # feet
description: >
  A compact two-story Victorian with a wraparound front porch, bay windows,
  fish-scale shingle gables, and a steep hipped roof. The ground floor flows
  from the porch and foyer into a living room with a fireplace, then a dining
  room and a kitchen that opens onto the rear deck.

# Transparent-background version of the isometric image, used on the homepage.
cutout: ./cutout.png

photos:
  - src: ./isometric.jpg
    alt: Isometric illustration of a mint-green Victorian house with a gray shingle roof, front porch, and purple fence
    caption: Isometric view

# Line-only plans generated by `npm run floorplans` from the floorplan-*.png originals.
floorPlans:
  - src: ./floorplan-level-1.lines.png
    alt: First floor plan showing porch, foyer, living room, dining room, bedroom, bath, kitchen, laundry, and deck
    caption: Level 1
  - src: ./floorplan-level-2.lines.png
    alt: Second floor plan showing two bedrooms, a bath, stairs, and a long hall
    caption: Level 2
    scale: 0.715 # image is drawn ~1.4x larger than Level 1 (stair treads 13px vs 9.25px)

# The earlier untextured model (/models/victorian-test-house-1.glb) is kept in public/models but unused.
model:
  src: /models/victorian-cottage-26.glb
  alt: 3D model of the Victorian Test House
