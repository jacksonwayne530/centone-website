# Building #8. Specs below are estimates; replace them with real values when known.
number: 8
name: Modern Test House
location: Seattle, WA
type: Single-family residence
style: Modern
# Estimated from the floor plans (marked "not to scale"; stair treads set the scale).
bedrooms: 2
bathrooms: 2 # .5 = half bath
stories: 2 # sets the building's size on the homepage
squareFeet: 2600
lotWidth: 50 # feet
lotDepth: 100 # feet
description: >
  A timber-framed modern house with steep shed roofs on exposed glulam beams, a
  stacked-stone chimney, cedar siding, and walls of floor-to-ceiling glass. Cable-rail
  decks wrap two levels on the garden side. The main floor is one open room for the
  kitchen, living, and dining areas, with a study, bath, and utility room tucked along
  the side and doors out to the deck. Upstairs, the primary bedroom opens onto a
  balcony under the big roof overhang, next to a second bedroom, a lounge with its
  own deck, a bath, and laundry.

# Transparent-background version of the isometric image, used on the homepage.
cutout: ./cutout.png

photos:
  - src: ./Modern Test House Isometric.png
    alt: Isometric illustration of a modern timber-frame house with shed roofs, a stone chimney, large windows, and two levels of cable-rail decks
    caption: Isometric view

# Line-only plans generated by `npm run floorplans` from floorplan-level-*.png (cropped to remove
# the printed titles; both levels are drawn at the same scale).
floorPlans:
  - src: ./floorplan-level-1.lines.png
    alt: Main floor plan showing an open kitchen, living, and dining space, a study, bath, utility room, and a deck
    caption: Level 1
  - src: ./floorplan-level-2.lines.png
    alt: Upper floor plan showing a primary bedroom with balcony, a second bedroom, a lounge opening to a deck, a bath, and laundry
    caption: Level 2

model:
  src: /models/modern-house.glb
  alt: 3D model of the Modern Test House
