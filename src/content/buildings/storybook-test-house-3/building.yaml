# Building #3. Specs below are estimates; replace them with real values when known.
number: 3
name: Storybook Test House
location: Pittsburgh, PA
type: Single-family residence
style: Storybook
# Estimated from the floor plans (stair widths set the scale).
bedrooms: 3
bathrooms: 2.5 # .5 = half bath
stories: 2 # sets the building's size on the homepage
squareFeet: 2800
lotWidth: 60 # feet
lotDepth: 100 # feet
description: >
  A stone Storybook cottage with a steep, scalloped slate roof, a tall brick
  chimney, and a round turret with a conical roof framing the arched front door.
  The turret opens into a foyer between a living room with a fireplace and study
  on one side, and a dining room, kitchen with island, pantry, and powder room on
  the other, with a covered patio behind. Upstairs, the turret becomes a reading
  nook off the hall, alongside a primary suite with bath and walk-in closet, two
  bedrooms, and a hall bath.

# Transparent-background version of the isometric image, used on the homepage.
cutout: ./cutout.png

photos:
  - src: ./Storybook Test House Isometric.jpg
    alt: Isometric illustration of a stone cottage with a scalloped slate roof, brick chimney, round turret entry, and surrounding trees and flower beds
    caption: Isometric view

# Line-only plans generated by `npm run floorplans` from the floorplan-*.png originals.
# (floorplan-level-*.png were cropped and resized from main/upper_level_floorplan.jpg to remove
# the baked-in titles; both levels are already drawn at the same scale.)
floorPlans:
  - src: ./floorplan-level-1.lines.png
    alt: Main floor plan showing a turret foyer, living room with fireplace, study, powder room, pantry, kitchen with island, dining room, and covered patio
    caption: Level 1
  - src: ./floorplan-level-2.lines.png
    alt: Upper floor plan showing a primary bedroom with bath, toilet room, and walk-in closet, two bedrooms, a hall bath, and a reading nook in the turret
    caption: Level 2

model:
  src: /models/stone-turret-cottage.glb
  alt: 3D model of the Storybook Test House
