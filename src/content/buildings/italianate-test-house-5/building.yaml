# Building #5. Specs below are estimates; replace them with real values when known.
number: 5
name: Italianate Test House
location: Location TBD # TODO: set the city
type: Single-family residence
style: Italianate
# Estimated from the floor plans (stair widths set the scale).
bedrooms: 4
bathrooms: 3.5 # .5 = half bath
squareFeet: 3100
lotWidth: 40 # feet
lotDepth: 110 # feet
description: >
  A cream-painted Italianate with a hipped slate roof, a bracketed cornice, a
  pedimented front door, and a three-story round turret on the corner. A central
  hall runs front to back: living room with a turret alcove, dining room, and a
  kitchen with an island on one side; a library, study, powder room, and mudroom
  on the other. The second floor holds a primary suite with a dressing room and
  ensuite, two more bedrooms, and a hall bath, and the attic adds a guest room,
  studio, reading loft, and another bath under the eaves.

# Transparent-background version of the isometric image, used on the homepage.
cutout: ./cutout.png

photos:
  - src: ./italianate isometric.png
    alt: Isometric illustration of a cream Italianate house with a round corner turret, slate hipped roof, front stoop, iron fence, and garden
    caption: Isometric view

# Line-only plans generated by `npm run floorplans` from the floorplan-*.png originals.
# (floorplan-level-*.png were cropped from the *_floorplan.jpg sheets to remove the printed
# titles and labels; all three levels are drawn at the same scale.)
floorPlans:
  - src: ./floorplan-level-1.lines.png
    alt: Main floor plan showing a central foyer and hall, living room with turret alcove, dining room, kitchen with island, library, study, powder room, and mudroom
    caption: Level 1
  - src: ./floorplan-level-2.lines.png
    alt: Second floor plan showing a primary bedroom with dressing room and ensuite, two bedrooms, a hall bath, and a turret sitting nook
    caption: Level 2
  - src: ./floorplan-level-3.lines.png
    alt: Attic plan showing a guest room, studio with turret nook, reading loft, bath, and storage under low eaves
    caption: Level 3

model:
  src: /models/italianate.glb
  alt: 3D model of the Italianate Test House
