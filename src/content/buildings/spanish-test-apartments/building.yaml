# Building #6. Specs below are estimates; replace them with real values when known.
number: 6
name: Spanish Test Apartments
location: Portland, OR
type: Apartment building (8 units)
style: Spanish Revival
# Estimated from the floor plans. Totals for the building: each unit has 2 bedrooms and 2 baths.
bedrooms: 16
bathrooms: 16 # .5 = half bath
stories: 2 # sets the building's size on the homepage
squareFeet: 15000
lotWidth: 100 # feet
lotDepth: 100 # feet
description: >
  A Spanish Revival courtyard apartment building in coral stucco under hipped
  clay-tile roofs, with wrought-iron balconies, arched French doors, and palms
  along the street. Two mirrored wings frame a long central courtyard entered
  beneath a tiled canopy signed "Santa Monica Court." Each floor holds four
  two-bedroom, two-bath apartments, each with its own kitchen, dining room, and
  living room opening onto windows on three sides, plus a shared lounge and den
  with a fireplace at the back of the courtyard.

# Transparent-background version of the isometric image, used on the homepage.
cutout: ./cutout.png

photos:
  - src: ./Santa Monica Court Isometric.png
    alt: Isometric illustration of a coral Spanish Revival courtyard apartment building with clay tile roofs, iron balconies, and palm trees
    caption: Isometric view

# Line-only plans generated by `npm run floorplans` from floorplan-level-*.png (both levels share one scale).
floorPlans:
  - src: ./floorplan-level-1.lines.png
    alt: First floor plan showing four two-bedroom apartments in two mirrored wings around a central courtyard, with an entry and a shared lounge
    caption: Level 1
  - src: ./floorplan-level-2.lines.png
    alt: Second floor plan showing four two-bedroom apartments, a den at the back, and the courtyard open to below
    caption: Level 2

model:
  src: /models/santa-monica-court.glb
  alt: 3D model of the Spanish Test Apartments
