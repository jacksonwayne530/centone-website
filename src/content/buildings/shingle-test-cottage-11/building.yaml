# Building #11. Specs below are estimates; replace them with real values when known.
number: 11
name: Shingle Test Cottage
location: Chatham, MA
type: Single-family residence
style: Shingle
# Estimated from the floor plans (marked "not to scale"; stair treads set the scale).
bedrooms: 3
bathrooms: 1.5 # .5 = half bath
stories: 2 # sets the building's size on the homepage
squareFeet: 1900
lotWidth: 60 # feet
lotDepth: 100 # feet
description: >
  A cedar-shingled cottage in the New England tradition, with a steep roof broken by
  shed and gabled dormers, a cupola topped by a sailboat weathervane, a fieldstone
  chimney, and a small columned porch over the front door. A crushed-shell driveway
  runs past beds of hydrangeas. The front door opens to a center foyer and stair,
  with the living room on one side and the kitchen and dining room on the other, plus
  a mudroom, laundry, and half bath at the back. Upstairs, four rooms under the roof
  (a primary bedroom, two more bedrooms, and a study or guest room) share a hall bath.

# Transparent-background version of the isometric image, used on the homepage. Made with
# `npm run cutout -- ... --no-pockets` so the cream trim stays solid.
cutout: ./cutout.png

photos:
  - src: ./Shingle Test Cottage Isometric.png
    alt: Isometric illustration of a cedar-shingled cottage with dormers, a cupola with a sailboat weathervane, a stone chimney, and a columned porch
    caption: Isometric view

# Line-only plans generated by `npm run floorplans` from floorplan-level-*.png (cropped to remove
# the printed titles; both levels are drawn at the same scale).
floorPlans:
  - src: ./floorplan-level-1.lines.png
    alt: Main floor plan showing a center foyer and stair, a living room, kitchen, dining room, mudroom, laundry, half bath, and front porch
    caption: Level 1
  - src: ./floorplan-level-2.lines.png
    alt: Upper floor plan showing a primary bedroom, two more bedrooms, a study or guest room, and a hall bath
    caption: Level 2

model:
  src: /models/shingle-cottage.glb
  alt: 3D model of the Shingle Test Cottage
