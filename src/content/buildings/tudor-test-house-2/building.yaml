description: >
  A three-level Tudor Revival with half-timbered gables, a brick entry porch
  under a steep front gable, and a slate-gray shingle roof. The main level
  opens from the foyer to an office, dining area, and kitchen, then into a
  breakfast nook and a living room with a fireplace and a covered patio. Upstairs
  are the primary suite and two bedrooms; the lower level holds a garage and a
  recreation room.

