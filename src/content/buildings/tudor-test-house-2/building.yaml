# Building #2. Specs below are estimates; replace them with real values when known.
number: 2
name: Tudor Test House
location: Portland, OR
type: Single-family residence
style: Tudor
# Estimated from the floor plans (stair widths set the scale).
bedrooms: 3
bathrooms: 4.5 # .5 = half bath
stories: 3 # sets the building's size on the homepage
squareFeet: 3400
lotWidth: 60 # feet
lotDepth: 110 # feet
description: >
  A three-level Tudor Revival with half-timbered gables, a brick entry porch
  under a steep front gable, and a slate-gray shingle roof. The main level
  opens from the foyer to an office, dining area, and kitchen, then into a
  breakfast nook and a living room with a fireplace and a covered patio. Upstairs
  are the primary suite and two bedrooms; the lower level holds a garage and a
  recreation room.

# Transparent-background version of the isometric image, used on the homepage.
cutout: ./cutout.png

photos:
  - src: ./Tudor Test House Isometric.jpg
    alt: Isometric illustration of a cream and dark-timbered Tudor house with a brick entry, gray shingle roof, and landscaped yard
    caption: Isometric view

# Line-only plans generated by `npm run floorplans` from the floorplan-*.png originals.
floorPlans:
  - src: ./floorplan-level-1.lines.png
    alt: Lower floor plan showing a garage, storage, utility room, bath, extra room, and recreation room
    caption: Level 1
  - src: ./floorplan-level-2.lines.png
    alt: Main floor plan showing foyer, office, dining area, kitchen, pantry, breakfast nook, living room, and covered patio
    caption: Level 2
    scale: 1.14 # image is drawn ~12% smaller than Levels 1 and 3 (stair treads 10.6px vs 12.1px)
  - src: ./floorplan-level-3.lines.png
    alt: Upper floor plan showing primary bedroom with bath and walk-in closet, two bedrooms, two baths, and laundry
    caption: Level 3

model:
  src: /models/tudor-house.glb
  alt: 3D model of the Tudor Test House
